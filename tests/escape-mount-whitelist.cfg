# Escape-attempt fixture: the tenant config tries to bind-mount host /etc at
# /host-etc, which is outside the operator's mount_whitelist. nsjail must
# refuse to start the jail.

name: "escape-mount-whitelist"

mode: ONCE
hostname: "ESCAPE"
cwd: "/"

time_limit: 30

clone_newnet: false
clone_newcgroup: false

mount_whitelist: "/usr"
mount_whitelist: "/lib"
mount_whitelist: "/lib64"
mount_whitelist: "/tmp"

mount {
	src: "/usr"
	dst: "/usr"
	is_bind: true
	rw: false
}
mount {
	src: "/usr/lib"
	dst: "/lib"
	is_symlink: true
}
mount {
	src: "/usr/lib64"
	dst: "/lib64"
	is_symlink: true
}
mount {
	dst: "/tmp"
	fstype: "tmpfs"
	rw: true
	is_dir: true
}

# The escape attempt: exfiltrate the host's /etc into the jail.
mount {
	src: "/etc"
	dst: "/host-etc"
	is_bind: true
	rw: false
	mandatory: false
}

exec_bin {
	path: "/usr/bin/id"
}
