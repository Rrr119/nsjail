# Escape-attempt fixture: the tenant config hides a path traversal in the
# mount destination. "/tmp/../host-etc" normalizes to "/host-etc", which is
# outside the operator's mount_whitelist, so nsjail must refuse to start.

name: "escape-mount-traversal"

mode: ONCE
hostname: "ESCAPE"
cwd: "/"

time_limit: 30

clone_newnet: false
clone_newcgroup: false

mount_whitelist: "/usr"
mount_whitelist: "/lib"
mount_whitelist: "/lib64"
mount_whitelist: "/tmp"

mount {
	src: "/usr"
	dst: "/usr"
	is_bind: true
	rw: false
}
mount {
	src: "/usr/lib"
	dst: "/lib"
	is_symlink: true
}
mount {
	src: "/usr/lib64"
	dst: "/lib64"
	is_symlink: true
}
mount {
	dst: "/tmp"
	fstype: "tmpfs"
	rw: true
	is_dir: true
}

# The escape attempt: sneak out of the whitelisted /tmp via "..".
mount {
	src: "/etc"
	dst: "/tmp/../host-etc"
	is_bind: true
	rw: false
	mandatory: false
}

exec_bin {
	path: "/usr/bin/id"
}
