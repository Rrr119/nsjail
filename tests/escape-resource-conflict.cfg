# Escape-attempt fixture: the tenant config tries to neutralize the operator's
# resource_limits combination with disable_rl. nsjail must reject the config.

name: "escape-resource-conflict"

mode: ONCE
hostname: "ESCAPE"
cwd: "/"

time_limit: 30

clone_newnet: false
clone_newcgroup: false

disable_rl: true

resource_limits {
	rlimit_as: 64
}

mount {
	src: "/"
	dst: "/"
	is_bind: true
	rw: false
}

exec_bin {
	path: "/usr/bin/id"
}
