# Policy fixture: the operator forces netns_policy NETNS_HOST, so the jail
# must share the host network namespace even though the tenant config asked
# for a private one (clone_newnet defaults to true).

name: "escape-netns-host"

mode: ONCE
hostname: "ESCAPE"
cwd: "/"

time_limit: 30

clone_newnet: true
clone_newcgroup: false
netns_policy: NETNS_HOST

mount {
	src: "/"
	dst: "/"
	is_bind: true
	rw: false
}
mount_proc: true

exec_bin {
	path: "/usr/bin/readlink"
	arg: "/proc/self/ns/net"
}
