# Escape-attempt fixture: the operator pins a combined resource-limit profile
# via resource_limits. The jailed command verifies the limits are in force and
# then tries to escape them (raising hard limits, writing past RLIMIT_FSIZE).

name: "escape-resource-limits"

mode: ONCE
hostname: "ESCAPE"
cwd: "/"

time_limit: 30

clone_newnet: false
clone_newcgroup: false

resource_limits {
	rlimit_as: 64
	rlimit_cpu: 5
	rlimit_nofile: 64
	rlimit_nproc: 512
	rlimit_fsize: 2
}

mount {
	src: "/"
	dst: "/"
	is_bind: true
	rw: false
}
mount {
	dst: "/tmp"
	fstype: "tmpfs"
	rw: true
	is_dir: true
}

exec_bin {
	path: "/usr/bin/bash"
	arg: "-c"
	arg: "set -u; "
	    "fail() { echo \"FAIL: $*\" >&2; exit 1; }; "
	    "[ \"$(ulimit -v)\" = 65536 ] || fail \"RLIMIT_AS is $(ulimit -v), expected 65536\"; "
	    "[ \"$(ulimit -t)\" = 5 ] || fail \"RLIMIT_CPU is $(ulimit -t), expected 5\"; "
	    "[ \"$(ulimit -n)\" = 64 ] || fail \"RLIMIT_NOFILE is $(ulimit -n), expected 64\"; "
	    "[ \"$(ulimit -u)\" = 512 ] || fail \"RLIMIT_NPROC is $(ulimit -u), expected 512\"; "
	    "ulimit -v 999999 2>/dev/null && fail \"raised RLIMIT_AS past the hard limit\"; "
	    "ulimit -n 4096 2>/dev/null && fail \"raised RLIMIT_NOFILE past the hard limit\"; "
	    "dd if=/dev/zero of=/tmp/escape.bin bs=1M count=10 2>/dev/null; "
	    "size=$(stat -c %s /tmp/escape.bin 2>/dev/null || echo 0); "
	    "[ \"$size\" -le 2097152 ] || fail \"wrote $size bytes despite RLIMIT_FSIZE=2MiB\"; "
	    "echo ESCAPE_RESOURCE_CHECKS_PASSED"
}
