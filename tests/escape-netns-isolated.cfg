# Escape-attempt fixture: the operator forces netns_policy NETNS_ISOLATED,
# while the tenant config tries every knob to regain network access:
# sharing the host network, bringing up loopback, and user-mode networking.
# The policy must override all of them.

name: "escape-netns-isolated"

mode: ONCE
hostname: "ESCAPE"
cwd: "/"

time_limit: 30

clone_newcgroup: false
netns_policy: NETNS_ISOLATED

# Escape attempts, all expected to be neutralized by the policy.
clone_newnet: false
iface_no_lo: false
user_net {
	backend: NSTUN
}

mount {
	src: "/"
	dst: "/"
	is_bind: true
	rw: false
}
mount_proc: true

exec_bin {
	path: "/usr/bin/readlink"
	arg: "/proc/self/ns/net"
}
